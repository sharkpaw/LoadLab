# LoadLab — Coolify-compatible compose (Git repository → Docker Compose)
#
# In Coolify:
#   1. Assign a domain to the "api" service (e.g. https://loadlab.example.com:8080 — :8080 is the internal port)
#   2. Set ADMIN_EMAIL in the panel; the first admin password is SERVICE_PASSWORD_ADMIN (Coolify generates it)
# Locally: COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml in .env (publishes the port)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loadlab}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-loadlab}
      # Only SERVICE_* names are auto-generated by Coolify; :? prevents silently starting with an empty value
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?SERVICE_PASSWORD_POSTGRES is required (Coolify generates it)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-loadlab} -d ${POSTGRES_DB:-loadlab}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Session cache + rate limiting + live metrics; persisted across restarts with AOF
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Panel + REST API + MCP (/mcp). The only publicly exposed service.
  api:
    build: .
    restart: unless-stopped
    command: ["bun", "src/api.ts"]
    # expose, not ports: the Coolify proxy reads the port from here; no 502 even if :port is dropped when editing the domain
    expose:
      - "8080"
    environment:
      # Tells Coolify the domain + upstream port (must be map syntax; list syntax gives a "non-string key" error)
      SERVICE_URL_API_8080:
      # May be empty before a domain is assigned; no :? here or the deployment fails before building
      PUBLIC_URL: ${PUBLIC_URL:-${SERVICE_URL_API:-}}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES:-loadlab}:${SERVICE_PASSWORD_POSTGRES:?SERVICE_PASSWORD_POSTGRES is required (Coolify generates it)}@postgres:5432/${POSTGRES_DB:-loadlab}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_AUTH:?SERVICE_HEX_64_AUTH is required (Coolify generates it)}
      # The first admin is only created when the database has no users
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN:?SERVICE_PASSWORD_ADMIN is required (Coolify generates it)}
      # Optional SMTP for password-reset mail; without it the reset link is printed to the api log
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Coolify's Traefik/Caddy is a single hop; the client IP (rate limiting) is resolved accordingly
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_ALLOW_RUN: ${MCP_ALLOW_RUN:-false}
      MCP_ALLOW_DEBUG: ${MCP_ALLOW_DEBUG:-true}
      MAX_VUS: ${MAX_VUS:-5000}
      MAX_RATE: ${MAX_RATE:-20000}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-14400}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Load generator (k6). Runs one test at a time; increase replicas for parallel tests.
  worker:
    build: .
    restart: unless-stopped
    command: ["bun", "src/worker.ts"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-${SERVICE_URL_API:-}}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES:-loadlab}:${SERVICE_PASSWORD_POSTGRES:?SERVICE_PASSWORD_POSTGRES is required (Coolify generates it)}@postgres:5432/${POSTGRES_DB:-loadlab}
      REDIS_URL: redis://redis:6379
      MAX_VUS: ${MAX_VUS:-5000}
      MAX_RATE: ${MAX_RATE:-20000}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-14400}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    # Graceful stop period for k6 so the running test's summary can be written
    stop_grace_period: 70s
    # Guards against "too many open files" / source port exhaustion at high concurrency
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: "1"

volumes:
  pgdata:
  redisdata:
