# LoadLab for Docker Compose and Coolify. Setup: README.md → "Deploy on Coolify".

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loadlab}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-loadlab}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-loadlab} -d ${POSTGRES_DB:-loadlab}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dashboard, REST API and MCP server
  loadlab:
    build: .
    restart: unless-stopped
    command: ["bun", "src/api.ts"]
    expose:
      - "8080"
    environment:
      SERVICE_URL_LOADLAB_8080:
      PUBLIC_URL: ${PUBLIC_URL:-${SERVICE_URL_LOADLAB:-}}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES:-loadlab}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-loadlab}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_AUTH}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_ALLOW_RUN: ${MCP_ALLOW_RUN:-false}
      MCP_ALLOW_DEBUG: ${MCP_ALLOW_DEBUG:-true}
      MAX_VUS: ${MAX_VUS:-5000}
      MAX_RATE: ${MAX_RATE:-20000}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-14400}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Runs k6, one test at a time per replica
  worker:
    build: .
    restart: unless-stopped
    command: ["bun", "src/worker.ts"]
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES:-loadlab}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-loadlab}
      REDIS_URL: redis://redis:6379
      MAX_VUS: ${MAX_VUS:-5000}
      MAX_RATE: ${MAX_RATE:-20000}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-14400}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    stop_grace_period: 70s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: "1"

volumes:
  pgdata:
  redisdata:
